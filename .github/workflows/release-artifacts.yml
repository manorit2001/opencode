name: release-artifacts

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed

concurrency: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'wip' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download build outputs
        uses: actions/download-artifact@v4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          name: build-dist
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package artifacts
        shell: bash
        run: |
          rm -f ./*.zip ./*.tar.gz
          for dir in packages/opencode/dist/*; do
            [ -d "$dir/bin" ] || continue
            name=$(basename "$dir")
            if [[ "$name" == *linux* ]]; then
              tar -czf "${name}.tar.gz" -C "$dir/bin" .
              continue
            fi
            (
              cd "$dir/bin"
              zip -r "$GITHUB_WORKSPACE/${name}.zip" .
            )
          done

      - name: Publish wip release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if gh release view wip --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit wip \
              --title "wip" \
              --notes "Latest artifacts from ${SHA}" \
              --prerelease \
              --repo "$GH_REPO"
          else
            gh release create wip \
              --title "wip" \
              --notes "Latest artifacts from ${SHA}" \
              --prerelease \
              --repo "$GH_REPO"
          fi
          gh release upload wip ./install ./*.zip ./*.tar.gz --clobber --repo "$GH_REPO"
