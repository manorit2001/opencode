name: build

on:
  push:
    branches:
      - wip

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: ./packages/opencode/script/build.ts

      - name: Package artifacts
        shell: bash
        run: |
          rm -f ./*.zip ./*.tar.gz
          for dir in packages/opencode/dist/*; do
            [ -d "$dir/bin" ] || continue
            name=$(basename "$dir")
            if [[ "$name" == *linux* ]]; then
              tar -czf "${name}.tar.gz" -C "$dir/bin" .
              continue
            fi
            (
              cd "$dir/bin"
              zip -r "$GITHUB_WORKSPACE/${name}.zip" .
            )
          done

      - name: Publish wip release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view wip --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit wip \
              --title "wip" \
              --notes "Latest artifacts from ${SHA}" \
              --latest \
              --repo "$GH_REPO"
          else
            gh release create wip \
              --title "wip" \
              --notes "Latest artifacts from ${SHA}" \
              --latest \
              --repo "$GH_REPO"
          fi
          gh release upload wip ./install ./*.zip ./*.tar.gz --clobber --repo "$GH_REPO"
